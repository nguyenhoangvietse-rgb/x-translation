name: Auto Translate Agent
on:
  repository_dispatch:
    types: [new_book_uploaded]
  workflow_dispatch:
    inputs:
      book_name:
        description: 'Tên sách (không có đuôi .txt)'
        required: true
        type: string
      chapter_id:
        description: 'ID chapter để dịch lại (0-index, để trống nếu dịch full book)'
        required: false
        type: number

permissions:
  actions: write
  contents: read

jobs:
  process-translation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Translation Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHAPTER_ID: ${{ github.event.client_payload.chapter_id || inputs.chapter_id || '' }}
        run: >
          python scripts/translate.py
          --book "${{ github.event.client_payload.book_name || inputs.book_name }}"
          ${CHAPTER_ID:+--chapter $CHAPTER_ID}
